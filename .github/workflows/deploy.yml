# Build the database from the workbook in data/ and deploy app/static/ to Cloudflare Pages.
# Pushes to main deploy to production; "Run workflow" on any other branch makes a preview deploy.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README → Deploy from GitHub Actions).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_NAME: natrep-explorer
  WORKBOOK: data/Global_Nat_Rep_and_Zip_Codes_Combined.xlsx

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install importer dependencies
        run: pip install -r requirements.txt

      - name: Build database
        run: python scripts/build_db.py "$WORKBOOK" data/natrep.db app/static/db

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy app/static --project-name "$PROJECT_NAME" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
