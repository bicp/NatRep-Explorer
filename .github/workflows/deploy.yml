# Build the database from the workbook in data/ and deploy app/static/ to Cloudflare Pages.
# - Push to main (e.g. merging a pull request) → production, https://natrep-explorer.pages.dev
# - Pull request → preview at https://<branch>.natrep-explorer.pages.dev, linked in a comment on the PR
# - "Run workflow" on any branch → preview deploy of that branch
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README → Deploy to Cloudflare Pages).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # one deploy per branch at a time; a new push to a pull request replaces its running preview deploy
  group: deploy-pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write # comment the preview link on the pull request

env:
  PROJECT_NAME: natrep-explorer
  WORKBOOK: data/Global_Nat_Rep_and_Zip_Codes_Combined.xlsx
  # Cloudflare treats "main" as production and every other branch name as a preview
  DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  deploy:
    # pull requests from forks don't get the secrets, so they can't deploy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install importer dependencies
        run: pip install -r requirements.txt

      - name: Build database
        run: python scripts/build_db.py "$WORKBOOK" data/natrep.db app/static/db

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          set -o pipefail # fail the step if wrangler fails, not just tee
          npx --yes wrangler@4 pages deploy app/static --project-name "$PROJECT_NAME" \
            --branch "$DEPLOY_BRANCH" --commit-hash "$COMMIT_SHA" 2>&1 | tee wrangler.log
          # the per-deploy URL, and the stable per-branch alias if Wrangler prints one
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' wrangler.log | head -1)" >> "$GITHUB_OUTPUT"
          echo "alias=$(grep -i 'alias' wrangler.log | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | head -1)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the preview link on the pull request
        if: github.event_name == 'pull_request'
        run: |
          body="🐝 **Preview deployed** for ${COMMIT_SHA:0:7}: ${ALIAS:-$URL}"
          [ -n "$ALIAS" ] && [ "$ALIAS" != "$URL" ] && body="$body"$'\n\n'"This commit only: $URL"
          # update the bot's previous preview comment if there is one, otherwise add a new comment
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
